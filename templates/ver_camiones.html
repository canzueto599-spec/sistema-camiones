<!DOCTYPE html>
<html>
<head>
    <title>Sistema de Camiones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <h1 class="text-center mb-4">🚛 Sistema de Camiones</h1>

    <a href="/agregar" class="btn btn-primary mb-3">Agregar Camión</a>

    <div class="card shadow">
        <div class="card-body">

            <table class="table table-striped table-bordered">
                <thead class="table-dark">
                    <tr>
                        <th>Marca</th>
                        <th>Modelo</th>
                        <th>Año</th>
                        <th>Placas</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    {% for camion in camiones %}
                    <tr>
                        <td>{{ camion[1] }}</td>
                        <td>{{ camion[2] }}</td>
                        <td>{{ camion[3] }}</td>
                        <td>{{ camion[4] }}</td>
                        <td>
                            <a href="/camion/{{ camion[0] }}" class="btn btn-sm btn-info">Ver</a>
                            <a href="/qr/{{ camion[0] }}" class="btn btn-sm btn-success">QR</a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>

        </div>
    </div>

</div>

</body>
</html>
