<!DOCTYPE html>
<html>
<head>
    <title>Detalle Camión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <h2>Detalle del Camión</h2>

    <ul class="list-group">
        <li class="list-group-item"><strong>Marca:</strong> {{ camion[1] }}</li>

        <li class="list-group-item"><strong>Placas:</strong> {{ camion[4] }}</li>
    </ul>

    <br>
    <a href="/" class="btn btn-secondary">Volver</a>

</div>

</body>
</html>
