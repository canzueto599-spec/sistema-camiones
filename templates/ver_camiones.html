<!DOCTYPE html>
<html>
<head>
    <title>Camiones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <h1 class="mb-4">🚚 Sistema de Camiones</h1>

    <a href="/agregar" class="btn btn-primary mb-3">+ Agregar Camión</a>

    <table class="table table-striped table-bordered">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Marca</th>
                <th>Modelo</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            {% for camion in camiones %}
            <tr>
                <td>{{ camion.id }}</td>
                <td>{{ camion.marca }}</td>
                <td>{{ camion.modelo }}</td>
                <td>
                    <a href="/qr/{{ camion.id }}" class="btn btn-success btn-sm">QR</a>
                    <a href="/editar/{{ camion.id }}" class="btn btn-warning btn-sm">Editar</a>
                    <a href="/eliminar/{{ camion.id }}" 
                       class="btn btn-danger btn-sm"
                       onclick="return confirm('¿Seguro que deseas eliminar este camión?')">
                       Eliminar
                    </a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</div>

</body>
</html>
